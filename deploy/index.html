  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lay:flex; align-items:center; justify-content:center; padding:20px\">\n      <div style=\"width:100%; max-width:460px; background:#111316; border:1px solid #23262b; border-radius:18px; padding:22px; box-shadow:0 40px 90px -30px rgba(0,0,0,.95)\">\n        <div style=\"font-size:17px; font-weight:600; margin-bottom:6px\">Acceso del equipo<\u002Fdiv>\n        <div style=\"font-size:13px; line-height:1.6; color:#7b818b; margin-bottom:16px; text-wrap:pretty\">Ingresá la contraseña de ventas de Future. Se pide una sola vez por navegador.<\u002Fdiv>\n        <input value=\"{{ keyDraft }}\" sc-camel-on-change=\"{{ onKeyDraft }}\" type=\"password\" placeholder=\"Contraseña del equipo\" style=\"width:100%; background:#0d0f11; border:1px solid #23262b; border-radius:11px; color:#e8eaed; font-size:14px; padding:11px 13px; outline:none\">\n        <div style=\"display:flex; gap:10px; margin-top:16px; justify-content:flex-end; align-items:center\">\n          <sc-if value=\"{{ hasKey }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ borrarKey }}\" style=\"background:transparent; border:none; color:#ff7b72; font-size:13px; cursor:pointer; margin-right:auto\">Cerrar sesión<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ cerrarKey }}\" style=\"background:#1a1d21; border:1px solid #2c3037; color:#c7cbd1; font-size:13.5px; padding:9px 15px; border-radius:10px; cursor:pointer\">Cancelar<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ guardarKey }}\" style=\"background:#2f6bff; border:none; color:#fff; font-size:13.5px; font-weight:600; padding:9px 17px; border-radius:10px; cursor:pointer\" style-hover=\"background:#4a80ff\">Guardar<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"width:100%; max-width:760px; margin-top:9vh; display:flex; flex-direction:column; align-items:center\">\n    <h1 style=\"font-size:38px; font-weight:600; letter-spacing:-0.03em; margin:0 0 10px; text-align:center; text-wrap:balance\">¿Qué perfil analizamos hoy?<\u002Fh1>\n    <p style=\"margin:0 0 30px; color:#7b818b; font-size:15px; text-align:center; max-width:520px; text-wrap:pretty\">Pegá el link del perfil de Instagram. Te devuelvo diagnóstico, mejoras y cómo encararlo según el ICP de Future.<\u002Fp>\n\n    <div style=\"width:100%; background:#111316; border:1px solid #23262b; border-radius:18px; padding:14px 14px 12px; box-shadow:0 24px 60px -30px rgba(0,0,0,.9)\">\n      <input value=\"{{ url }}\" sc-camel-on-change=\"{{ onUrl }}\" sc-camel-on-key-down=\"{{ onKey }}\" placeholder=\"https://instagram.com/usuario\" style=\"width:100%; background:transparent; border:none; outline:none; color:#e8eaed; font-size:17px; padding:8px 6px 6px\">\n      <textarea value=\"{{ notes }}\" sc-camel-on-change=\"{{ onNotes }}\" placeholder=\"Contexto extra (opcional): qué viste en el perfil, seguidores, oferta, si tiene web, cómo llegó el lead…\" rows=\"2\" style=\"width:100%; background:transparent; border:none; outline:none; color:#b9bec6; font-size:14px; padding:6px; resize:none; line-height:1.5\"><\u002Ftextarea>\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:6px\">\n        <span style=\"font-size:12px; color:#5a5f68\">La IA no entra a Instagram: cuanto más contexto pegues, más filoso el análisis.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ analizar }}\" style=\"background:#2f6bff; color:#fff; border:none; border-radius:11px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap\" style-hover=\"background:#4a80ff\">{{ ctaLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center\">\n      <sc-for list=\"{{ ejemplos }}\" as=\"ej\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ ej.pick }}\" style=\"background:#111316; border:1px solid #23262b; color:#9aa0a9; font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer\" style-hover=\"border-color:#2f6bff; color:#e8eaed\">{{ ej.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:18px; width:100%; background:#1b1214; border:1px solid #4a2226; color:#ffb4b4; border-radius:12px; padding:12px 14px; font-size:13.5px\">{{ error }}<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:26px; display:flex; align-items:center; gap:10px; color:#7b818b; font-size:14px\">\n        <span style=\"width:7px; height:7px; border-radius:50%; background:#2f6bff; animation:pulseDot 1.1s infinite\"><\u002Fspan>\n        <span>Leyendo el perfil contra el ICP de Future…<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ hasResult }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"width:100%; max-width:860px; margin-top:44px; animation:riseIn .35s ease both\">\n\n      <div style=\"display:flex; align-items:flex-start; gap:16px; background:#111316; border:1px solid #23262b; border-radius:18px; padding:20px 22px\">\n        <div style=\"min-width:92px; text-align:center; border-right:1px solid #23262b; padding-right:16px\">\n          <div style=\"font-size:11px; letter-spacing:.08em; color:#7b818b; text-transform:uppercase\">Fit<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:700; margin-top:4px; color:{{ fitColor }}\">{{ fit }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:13px; color:#7b818b; margin-bottom:6px\">{{ handle }}<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.6; color:#dfe3e8; text-wrap:pretty\">{{ resumen }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:#7b818b; margin:34px 0 14px; font-weight:600\">Diagnóstico<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:12px\">\n        <sc-for list=\"{{ ejes }}\" as=\"eje\" hint-placeholder-count=\"4\">\n          <div style=\"background:#111316; border:1px solid #23262b; border-radius:16px; padding:16px 18px\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px\">\n              <span style=\"font-size:15px; font-weight:600\">{{ eje.nombre }}<\u002Fspan>\n              <span style=\"font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; color:{{ eje.color }}; background:{{ eje.bg }}\">{{ eje.estado }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:14px; line-height:1.6; color:#a7adb6; text-wrap:pretty\">{{ eje.lectura }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:#7b818b; margin:34px 0 14px; font-weight:600\">Mejoras propuestas<\u002Fh2>\n      <div style=\"display:flex; flex-direction:column; gap:10px\">\n        <sc-for list=\"{{ mejoras }}\" as=\"m\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; gap:14px; background:#111316; border:1px solid #23262b; border-radius:16px; padding:16px 18px\">\n            <div style=\"min-width:26px; height:26px; border-radius:8px; background:#17243f; color:#6f9bff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center\">{{ m.n }}<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px\">\n              <div style=\"font-size:15.5px; font-weight:600\">{{ m.titulo }}<\u002Fdiv>\n              <div style=\"font-size:14px; line-height:1.6; color:#a7adb6; text-wrap:pretty\">{{ m.porque }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#f5a524\">Servicio Future: {{ m.servicio }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <h2 style=\"font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:#7b818b; margin:34px 0 14px; font-weight:600\">Cómo encararlo<\u002Fh2>\n      <div style=\"background:#111316; border:1px solid #23262b; border-radius:18px; padding:20px 22px; display:flex; flex-direction:column; gap:16px\">\n        <div>\n          <div style=\"font-size:12px; color:#7b818b; margin-bottom:6px\">Ángulo<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.6; color:#dfe3e8; text-wrap:pretty\">{{ angulo }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; color:#7b818b; margin-bottom:6px\">Caso de éxito para apalancar<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.6; color:#dfe3e8; text-wrap:pretty\">{{ caso }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #23262b; padding-top:16px\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px\">\n            <div style=\"font-size:12px; color:#7b818b\">Mensaje sugerido<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ copiar }}\" style=\"background:#1a1d21; border:1px solid #2c3037; color:#c7cbd1; font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer\" style-hover=\"border-color:#2f6bff; color:#fff\">{{ copyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:14.5px; line-height:1.7; color:#dfe3e8; white-space:pre-wrap; background:#0d0f11; border:1px solid #1e2126; border-radius:12px; padding:14px 16px\">{{ mensaje }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasPreguntas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:22px; background:#0f1114; border:1px dashed #2c3037; border-radius:16px; padding:16px 18px\">\n          <div style=\"font-size:12px; color:#7b818b; margin-bottom:8px\">Para validar en la llamada<\u002Fdiv>\n          <sc-for list=\"{{ preguntas }}\" as=\"p\" hint-placeholder-count=\"3\">\n            <div style=\"font-size:14px; line-height:1.7; color:#a7adb6\">· {{ p.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:28px; font-size:12px; color:#4e535a; text-align:center\">Análisis generado con la info que pegó el setter. Contrastar en la llamada antes de prometer.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"width:100%; max-width:760px; margin-top:auto; padding-top:56px\">\n    <div style=\"border-top:1px solid #1e2126; padding-top:18px; display:flex; gap:12px; align-items:flex-start\">\n      <span style=\"min-width:22px; height:22px; border-radius:6px; background:#1a1d21; border:1px solid #2c3037; color:#7b818b; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center\">!<\u002Fspan>\n      <div style=\"font-size:12.5px; line-height:1.65; color:#6b7078; text-wrap:pretty\">\n        <span style=\"color:#9aa0a9; font-weight:600\">Uso interno exclusivo de Future Ahead.<\u002Fspan>\n        Esta herramienta y el criterio comercial, los datos de clientes y los casos de éxito que contiene son información confidencial de la empresa. Queda prohibido compartir el acceso, el link o las respuestas generadas fuera del equipo, así como usarla para fines ajenos a Future Ahead. Cualquier uso externo o divulgación es responsabilidad de quien lo comparte.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst ICP = `FUTURE AHEAD — CONTEXTO INTERNO\n\nQUÉ SOMOS: equipo/agencia DFY (done for you) de branding, diseño, landing pages, web y edición de contenido para marcas de infoproductos y ecommerce. Vendemos criterio y sistema, no piezas sueltas.\n\nICP:\n- Dueños de marcas de infoproductos o ecommerce que YA venden y cuyo negocio creció más rápido que su estructura operativa.\n- Dolor central: dependencia operativa y caos interno. El problema no es el diseño en sí, es la falta de un sistema con criterio que permita escalar sin perder tiempo ni consistencia.\n- Regla de oro: \"menor visibilidad personal + mayor influencia operativa\" — el mejor cliente delega ejecución y quiere entregas predecibles.\n- Señales de buen fit: oferta clara y ya validada, clientes/casos visibles, lanzamientos o campañas recurrentes, marca personal fuerte pero identidad visual floja, web/landing pobre o inexistente, equipo chico y saturado.\n- Señales de mal fit: no factura todavía, sin oferta definida, busca solo un logo barato, cuenta puramente de contenido sin monetización, ticket muy bajo.\n- Oportunidad premium: perfiles que atienden a otros negocios (agencias, mentores, consultores) → asociación a largo plazo para hacer DFY también a SUS clientes.\n\nSERVICIOS: branding e identidad, diseño de piezas para lanzamientos, landing pages y web, diseño de producto/módulos/webinars, material de venta, edición de video/contenido, retainer de diseño DFY.\n\nCASOS DE ÉXITO:\n- David Turu (Academia Lanzamiento): +$500.000 USD en lanzamientos en 4 meses, +500 piezas diseñadas, rebranding con UCAM. Cliente ancla y principal fuente de leads.\n- Christian Villar (WIT Academy): +$1.000.000 USD en su primer lanzamiento. Branding completo, módulos, webinars, web y material de venta.\n- Tilegit Surf School: +$200.000 USD en ventas.\n- Trabajo de tiendas y branding para clientes de Matias Etchevers (Rancho Doble), mejorando conversión de producto.\n\nACCIONABLE CORTO PLAZO TÍPICO: si no tiene landing de su mentoría/oferta funcionando como embudo, ofrecer armarla (~$300 USD en semana de prueba) para subir valor percibido y nivel de consciencia del comprador, y que sirva de puerta de entrada al retainer.`;\n\nconst COLORS = {\n  Fuerte: ['#4ade80', 'rgba(74,222,128,.12)'],\n  Mejorable: ['#f5a524', 'rgba(245,165,36,.12)'],\n  Débil: ['#ff7b72', 'rgba(255,123,114,.12)'],\n  Debil: ['#ff7b72', 'rgba(255,123,114,.12)']\n};\nconst FIT = { Alto: '#4ade80', Medio: '#f5a524', Bajo: '#ff7b72' };\n\nclass Component extends DCLogic {\n  state = { url: '', notes: '', loading: false, error: '', data: null, copied: false, apiKey: '', keyOpen: false, keyDraft: '' };\n\n  componentDidMount() {\n    try {\n      const k = localStorage.getItem('future_analizador_api_key') || '';\n      if (k) this.setState({ apiKey: k, keyDraft: k });\n    } catch (e) {}\n  }\n\n  async llamar(system, prompt) {\n    const body = {\n      model: 'claude-sonnet-4-5',\n      max_tokens: 3000,\n      system,\n      messages: [{ role: 'user', content: prompt }]\n    };\n    if (window.claude && window.claude.complete) return await window.claude.complete(body);\n    const res = await fetch('/api/analizar', {\n      method: 'POST',\n      headers: { 'content-type': 'application/json', 'x-team-password': this.state.apiKey || '' },\n      body: JSON.stringify(body)\n    });\n    if (res.status === 401) {\n      try { localStorage.removeItem('future_analizador_api_key'); } catch (e) {}\n      this.setState({ apiKey: '', keyOpen: true });\n      throw new Error('Contraseña incorrecta.');\n    }\n    if (res.status === 429) throw new Error('Se alcanzó el límite de análisis por hoy.');\n    if (!res.ok) throw new Error('Servidor ' + res.status + ': ' + (await res.text()).slice(0, 200));\n    const j = await res.json();\n    return (j.content || []).map(c => c.text || '').join('');\n  }\n\n  handleFrom(u) {\n    const m = (u || '').match(/instagram\\.com\\/([^/?#\\s]+)/i);\n    if (m) return '@' + m[1];\n    const c = (u || '').trim().replace(/^@/, '');\n    return c ? '@' + c.split(/[/?\\s]/)[0] : '';\n  }\n\n  async analizar() {\n    const { url, notes, loading } = this.state;\n    if (loading) return;\n    if (!url.trim() && !notes.trim()) { this.setState({ error: 'Pegá el link del perfil o escribí algo de contexto.' }); return; }\n    if (!this.state.apiKey && !(window.claude && window.claude.complete)) { this.setState({ keyOpen: true, error: 'Ingresá la contraseña del equipo.' }); return; }\n    this.setState({ loading: true, error: '', data: null, copied: false });\n    const handle = this.handleFrom(url);\n    const prompt = `Perfil a analizar: ${url || '(sin link)'}\\nUsuario: ${handle || 'desconocido'}\\nContexto que pegó el setter: ${notes || '(no dejó contexto)'}\\n\\nAnalizá este perfil para el equipo de ventas de Future Ahead. No tenés acceso a Instagram: trabajá con el handle, el nicho que se deduzca y el contexto dado, y sé explícito cuando algo sea una hipótesis a validar.\\n\\nDevolvé SOLO un JSON válido, sin texto alrededor, con esta forma exacta:\\n{\"fit\":\"Alto|Medio|Bajo\",\"resumen\":\"2-3 frases, tono de equipo, directo\",\"ejes\":[{\"nombre\":\"Branding\",\"estado\":\"Fuerte|Mejorable|Débil\",\"lectura\":\"1-2 frases\"},{\"nombre\":\"Contenido\",\"estado\":\"...\",\"lectura\":\"...\"},{\"nombre\":\"Oferta\",\"estado\":\"...\",\"lectura\":\"...\"},{\"nombre\":\"Web / Embudo\",\"estado\":\"...\",\"lectura\":\"...\"}],\"mejoras\":[{\"titulo\":\"...\",\"porque\":\"1-2 frases de por qué mueve la aguja\",\"servicio\":\"servicio de Future que lo resuelve\"}],\"angulo\":\"cómo encararlo, 2-3 frases\",\"caso\":\"qué caso de éxito usar y por qué encaja\",\"mensaje\":\"mensaje de DM listo para copiar, 4-6 líneas, español rioplatense, sin emojis, sin vender de una, abriendo con una observación concreta del perfil\",\"preguntas\":[\"pregunta para validar en la llamada\"]}\\n3 a 5 mejoras, 3 a 4 preguntas.`;\n    try {\n      const raw = await this.llamar(ICP + '\\n\\nSos el analista de ventas de Future Ahead. Hablás como parte del equipo: directo, argentino, sin relleno ni lenguaje de agencia. Nunca inventes métricas del perfil; si no sabés, planteá hipótesis y decí cómo validarla. Respondés únicamente con JSON válido.', prompt);\n      const s = raw.indexOf('{'), e = raw.lastIndexOf('}');\n      const data = JSON.parse(raw.slice(s, e + 1));\n      this.setState({ data: { ...data, handle: handle || 'Perfil sin link' }, loading: false });\n    } catch (err) {\n      this.setState({ loading: false, error: 'No se pudo generar el análisis. Probá de nuevo en unos segundos. (' + (err && err.message ? err.message : err) + ')' });\n    }\n  }\n\n  renderVals() {\n    const d = this.state.data;\n    const ejemplos = [\n      { label: 'Infoproductor de ecommerce', url: 'https://instagram.com/dropea.oficial', notes: '18K seguidores, e-commerce y automation dropshipping, buen branding, portadas hechas con IA, web de registro bastante básica.' },\n      { label: 'Mentor B2B', url: 'https://instagram.com/soyjonathanalef', notes: '17K seguidores, ayuda a infoproductores a escalar, les hace todo el backend, lead magnet con formulario, mucho contenido personal pero no se siente como marca.' },\n      { label: 'Limpiar', url: '', notes: '' }\n    ].map(e => ({ ...e, pick: () => this.setState({ url: e.url, notes: e.notes, error: '' }) }));\n\n    return {\n      url: this.state.url,\n      notes: this.state.notes,\n      loading: this.state.loading,\n      error: this.state.error,\n      ejemplos,\n      ctaLabel: this.state.loading ? 'Analizando…' : 'Analizar perfil',\n      onUrl: e => this.setState({ url: e.target.value }),\n      onNotes: e => this.setState({ notes: e.target.value }),\n      onKey: e => { if (e.key === 'Enter') this.analizar(); },\n      analizar: () => this.analizar(),\n      hasResult: !!d,\n      handle: d ? d.handle : '',\n      fit: d ? d.fit : '',\n      fitColor: d ? (FIT[d.fit] || '#e8eaed') : '#e8eaed',\n      resumen: d ? d.resumen : '',\n      ejes: d ? (d.ejes || []).map(x => {\n        const c = COLORS[x.estado] || ['#9aa0a9', 'rgba(154,160,169,.12)'];\n        return { ...x, color: c[0], bg: c[1] };\n      }) : [],\n      mejoras: d ? (d.mejoras || []).map((m, i) => ({ ...m, n: i + 1 })) : [],\n      angulo: d ? d.angulo : '',\n      caso: d ? d.caso : '',\n      mensaje: d ? d.mensaje : '',\n      hasPreguntas: !!(d && d.preguntas && d.preguntas.length),\n      preguntas: d ? (d.preguntas || []).map(t => ({ t })) : [],\n      hasKey: !!this.state.apiKey,\n      keyOpen: this.state.keyOpen,\n      keyDraft: this.state.keyDraft,\n      keyLabel: this.state.apiKey ? 'Equipo conectado' : 'Ingresar',\n      keyDotColor: this.state.apiKey ? '#4ade80' : '#f5a524',\n      abrirKey: () => this.setState({ keyOpen: true, keyDraft: this.state.apiKey }),\n      cerrarKey: () => this.setState({ keyOpen: false }),\n      onKeyDraft: e => this.setState({ keyDraft: e.target.value }),\n      guardarKey: () => {\n        const k = (this.state.keyDraft || '').trim();\n        try { if (k) localStorage.setItem('future_analizador_api_key', k); else localStorage.removeItem('future_analizador_api_key'); } catch (e) {}\n        this.setState({ apiKey: k, keyOpen: false, error: '' });\n      },\n      borrarKey: () => {\n        try { localStorage.removeItem('future_analizador_api_key'); } catch (e) {}\n        this.setState({ apiKey: '', keyDraft: '', keyOpen: false });\n      },\n      copyLabel: this.state.copied ? 'Copiado' : 'Copiar',\n      copiar: () => {\n        if (!d) return;\n        navigator.clipboard.writeText(d.mensaje || '');\n        this.setState({ copied: true });\n        setTimeout(() => this.setState({ copied: false }), 1600);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
